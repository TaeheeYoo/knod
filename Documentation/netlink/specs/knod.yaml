---
name: knod

doc:
  KNOD (KFD network offload) control plane.

  The GPUs a knod link (ip link add ... type knod) can run a NIC on, the
  NICs that can hand their queues over to one, and the links there are.
  What a GPU runs follows the link, XDP programs offloaded to it and
  IPsec with its esp-hw-offload.

definitions:
  -
    type: enum
    name: accel-type
    entries: [gpu, dpu]

attribute-sets:
  -
    name: accel
    attributes:
      -
        name: id
        doc: Accelerator id.
        type: u32
        checks:
          min: 1
      -
        name: name
        doc: Accelerator name.
        type: string
      -
        name: type
        doc: Accelerator type.
        type: u32
        enum: accel-type
  -
    name: nic
    attributes:
      -
        name: ifindex
        doc: ifindex of a NIC that can hand its queues over to another device.
        type: u32
        checks:
          min: 1
      -
        name: name
        doc: Name of the NIC netdevice.
        type: string
  -
    name: dev
    attributes:
      -
        name: nic-ifindex
        doc: ifindex of the bound NIC netdevice.
        type: u32
        checks:
          min: 1
      -
        name: accel-id
        doc: id of the bound accelerator.
        type: u32
        checks:
          min: 1
      -
        name: link-ifindex
        doc: ifindex of the knod link over the NIC.
        type: u32

operations:
  list:
    -
      name: accel-get
      doc: Get / dump accelerators registered on the system.
      attribute-set: accel
      do:
        request:
          attributes:
            - id
        reply: &accel-all
          attributes:
            - id
            - name
            - type
      dump:
        reply: *accel-all
    -
      name: nic-get
      doc: Get / dump NICs that can hand their queues over to a knod link.
      attribute-set: nic
      do:
        request:
          attributes:
            - ifindex
        reply: &nic-all
          attributes:
            - ifindex
            - name
      dump:
        reply: *nic-all
    -
      name: dev-get
      doc: Get / dump the knod links, each NIC with the accelerator on it.
      attribute-set: dev
      do:
        request:
          attributes:
            - nic-ifindex
        reply: &dev-all
          attributes:
            - nic-ifindex
            - accel-id
            - link-ifindex
      dump:
        reply: *dev-all
    -
      name: dev-add-ntf
      doc: Notification about a new NIC <-> accelerator binding.
      notify: dev-get
      mcgrp: mgmt
    -
      name: dev-del-ntf
      doc: Notification about a removed NIC <-> accelerator binding.
      notify: dev-get
      mcgrp: mgmt

mcast-groups:
  list:
    -
      name: mgmt
